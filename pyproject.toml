[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "Reusable orchestration kit for Claude Code projects: data contract, hooks, and dashboard tooling"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["streamlit>=1.40", "altair", "pandas"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]

# The JSON Schemas live in the repo-level schema/ directory (single source of
# truth); ship a copy inside the package so installed wheels can find them.
[tool.hatch.build.targets.wheel.force-include]
"schema" = "agent_workbench/contract/schema"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
