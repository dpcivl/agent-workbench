# Generic sample of .workbench/project.yaml (not tied to any real project).
project:
  id: example-project
  name: Example Project
  description: Sample project used to document and test the agent-workbench data contract.

agents:
  - id: researcher
    role: Surveys sources and lists candidate datasets
  - id: planner
    role: Turns findings into a prioritized plan
  - id: data-prep
    role: Builds a reproducible cleaning pipeline
  - id: analyst
    role: Analyzes the cleaned data and proposes options
  - id: pm-tracker
    role: Keeps project.yaml status in sync with events and deliverables
  - id: reviewer
    role: Independently verifies each phase before the gate

# Optional: project-specific input for the shared reviewer and fieldbook-writer agents.
review:
  sources:
    - docs/research/**
  checks:
    - id: leakage
      text: Verify that training and validation data are separated and that no future information is used.
      phases: [p4-analysis]
    - id: units
      text: Check column units, time zone and aggregation interval of every table that is used.
      phases: [p3-data, p4-analysis]
    - id: sources
      text: Every factual claim cites a source URL and an access date, or is marked unverified.

fieldbook:
  title: Example Project Fieldbook

phases:
  - id: p1-research
    name: Research
    status: done
    agents: [researcher]
    deliverables:
      - docs/research/summary.md
      - docs/research/dataset-candidates.md
    gate: dataset-selection
    tasks:
      - {id: t1, title: Summarize background, status: done, agent: researcher}
      - {id: t2, title: Compare candidate datasets, status: done, agent: researcher}

  - id: p2-design
    name: Design
    status: done
    agents: [planner]
    deliverables:
      - docs/plan/plan.md
    gate: phase-end
    tasks:
      - {id: t1, title: Draft the plan, status: done, agent: planner}

  - id: p3-data
    name: Data preparation
    status: doing
    agents: [data-prep, analyst]
    deliverables:
      - src/pipeline/clean.py
      - docs/data/data-dictionary.md
      - docs/data/quality-report.md
    gate: phase-end
    tasks:
      - {id: t1, title: Write the cleaning pipeline, status: done, agent: data-prep}
      - {id: t2, title: Profile missing values, status: doing, agent: analyst}
      - {id: t3, title: Write the data dictionary, status: todo, agent: data-prep}

  - id: p4-analysis
    name: Analysis
    status: todo
    agents: [analyst]
    deliverables:
      - docs/analysis/findings.md
      - notebooks/*.ipynb
      - results/p4-analysis/scenario-*
    gate: phase-end
    tasks: []
